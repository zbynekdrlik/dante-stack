name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - name: Docs build without warnings (broken or private links)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Line coverage against the floor (.github/coverage-floor)
        run: |
          set -euo pipefail
          floor="$(tr -d '[:space:]' < .github/coverage-floor)"
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines "$floor"

  rtsan:
    # The pump block and the histogram record under RealtimeSanitizer, and
    # the build an application's rtsan job makes of both crates.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with rust-src (rtsan builds std with -Zbuild-std)
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The rtsan test
        env:
          RUSTFLAGS: "-Zsanitizer=realtime --cfg iem_rtsan"
        run: cargo +nightly-2026-09-20 test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p dante-stack --test rtsan -- --nocapture

  fuzz:
    # Coverage-guided fuzzing of every datagram parser and server a foreign
    # device can reach (fuzz/): 30 s a target. A crash fails the build; its
    # input becomes a regression test in the crate.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain for cargo-fuzz (pinned)
        run: rustup toolchain install nightly-2026-09-20 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: cargo-fuzz (pinned; no prebuilt in install-action)
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: The fuzz lockfile is current (cargo-fuzz has no --locked)
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Fuzz each target for 30 s
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo +nightly-2026-09-20 fuzz list); do
            echo "::group::$target"
            cargo +nightly-2026-09-20 fuzz run "$target" -- -max_total_time=30
            echo "::endgroup::"
          done

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_version.py origin/${{ github.base_ref }}
